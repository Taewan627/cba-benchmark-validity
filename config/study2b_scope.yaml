project: CBA_Study2b_Scope
design_gate: CONDITIONAL PASS
api_enabled: true
api_budget_ceiling_usd: 5
budget_unlock_required: false
gateway: openrouter
gateway_endpoint: https://openrouter.ai/api/v1
gateway_api_key_env: OPENROUTER_API_KEY
models:
  - role: A
    requested_model: google/gemini-3.8-flash
    provider: google
  - role: B
    requested_model: anthropic/claude-sonnet-5
    provider: anthropic
protocols: [P2]
conditions: [CLEAN, COMMISSION, OMISSION]
base_cases: 60
point_cases: 30
scope_cases: 30
expected_calls: 360
study2:
  bootstrap_seed: 1732
  bootstrap_replicates: 10000
  confidence_level: 0.95
  primary_estimand: delta_scope
  delta_threshold: 0.15
  max_clean_fpr: 0.10
  max_invalid_fraction: 0.05
  cluster: base_case
  stratify: structure
decoding:
  temperature: 0
  reasoning_setting: none
  max_output_tokens: 6000
  response_format: json_object
paths:
  cases: data/study2b_scope_cases.jsonl
  manifest: data/study2b_scope_manifest.json
  rule_families: data/study2b_scope_rule_families.yaml
  raw_attempts: outputs/study2b_scope_v1/raw_attempts.jsonl
