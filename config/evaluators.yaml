# Stage-1 evaluator configuration (frozen).
#
# Both evaluators receive the SAME semantic instructions generated by
# src/protocol_construction.py (P1/P2/P3/P4). No per-model prompt optimization.
#
# All requests route through the OpenRouter gateway using OPENROUTER_API_KEY.
# ``provider`` below identifies the underlying model family (used for pricing
# and reporting); the actual model is requested by its full provider/model id.
#
# No latest aliases, no automatic substitution, and no fallback model IDs are
# used. The requested model ID below is the ONLY id that may be sent.
#
# Values marked PENDING_EXECUTION are filled at execution time and are part of
# the raw-attempt reproducibility record; they are never guessed here.
#
# Reasoning: both models request a non-thinking/deterministic mode
# (reasoning_setting "none"). The exact API parameter for disabling thinking is
# gateway/model-specific (e.g. OpenRouter ``reasoning`` / ``thinking``) and is
# recorded per call. If exact reasoning-effort equivalence across the two
# providers turns out to be impossible, that difference is recorded as a
# reproducibility note and NOT compensated by changing prompts.

version: 1
instructions_source: src/protocol_construction.py

gateway: openrouter
gateway_endpoint: https://openrouter.ai/api/v1
gateway_api_key_env: OPENROUTER_API_KEY

pricing:
  provisional: true
  note: >
    Provisional conservative per-model-family prices used only for the offline
    cost projection. OpenRouter prices are per-model; confirm at execution. The
    USD 10 ceiling is the hard safety limit regardless of the estimate.
  per_million_input_tokens_usd:
    google: 0.15
    anthropic: 3.00
  per_million_output_tokens_usd:
    google: 0.60
    anthropic: 15.00
  cached_input_discount: 0.10

evaluators:
  - role: A
    provider: google
    requested_model: google/gemini-3.8-flash
    returned_model: PENDING_EXECUTION
    reasoning_setting: none
    temperature: 0
    seed_requested: 1731
    seed_supported: PENDING_EXECUTION
    max_output_tokens: 6000
    response_format: json_object
  - role: B
    provider: anthropic
    requested_model: anthropic/claude-sonnet-5
    returned_model: PENDING_EXECUTION
    reasoning_setting: none
    temperature: 0
    seed_requested: 1731
    seed_supported: PENDING_EXECUTION
    max_output_tokens: 6000
    response_format: json_object
